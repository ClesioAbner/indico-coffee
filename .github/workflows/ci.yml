# Cada push e pull request verifica o código.
# A publicação no GitHub Pages só corre à mão: Actions > CI/CD > Run workflow > publicar.
# Antes da primeira publicação, ativar em Settings > Pages > Source: GitHub Actions.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar e gerar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Formato (Prettier), JavaScript (ESLint) e HTML (html-validate)
      - run: npm run lint

      # Copia o site para dist/ e confirma que todas as imagens, CSS e JS referidos existem
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: inputs.publicar
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: check
    if: inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
